# webnoveltoepub - lightweight variant (requests + BeautifulSoup) for CasaOS
# and other self-hosted panels.
#
# CasaOS: App Store -> Custom install -> paste this whole file -> Install
#
# Differences from the docker-compose.yml in the repo root:
#   * image instead of build - CasaOS does not build images from source
#   * no profiles - CasaOS runs the whole file at once
#   * values written out instead of ${VAR:-default} - Custom install does
#     not always respect a separate .env file
#   * bind mount on /DATA/AppData/... - finished EPUBs show up in File Manager
#   * saving to disk enabled (WNE_SAVE_TO_DISK)

name: webnoveltoepub

services:
  app:
    image: ghcr.io/spookydoge/webnoveltoepub:latest
    container_name: webnoveltoepub
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      WNE_SAVE_TO_DISK: "true"
      WNE_OUTPUT_DIR: "/app/output"
      WNE_MAX_CHAPTERS: "300"
      WNE_REQUEST_DELAY: "0.75"
      WNE_DEFAULT_LANGUAGE: "en"
      WNE_LOG_LEVEL: "INFO"
    volumes:
      - /DATA/AppData/webnoveltoepub/output:/app/output
    # The bind mount under /DATA belongs to root, while the image runs as
    # non-root (uid 10001) by default. Without this, writing EPUBs would fail,
    # and CasaOS offers no convenient way to chown from its UI.
    user: "0:0"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    x-casaos:
      envs:
        - container: WNE_DEFAULT_LANGUAGE
          description:
            en_US: "Fallback UI language when the browser language is unavailable (en, pl)."
        - container: WNE_MAX_CHAPTERS
          description:
            en_US: "Maximum number of chapters in a single EPUB."
        - container: WNE_REQUEST_DELAY
          description:
            en_US: "Delay in seconds between HTTP requests. Keep it polite."
        - container: WNE_SAVE_TO_DISK
          description:
            en_US: "Also save a copy of every generated EPUB to the output folder."
      ports:
        - container: "8000"
          description:
            en_US: "Web UI"
      volumes:
        - container: /app/output
          description:
            en_US: "Generated EPUB files"

x-casaos:
  id: io.github.spookydoge.webnoveltoepub
  architectures:
    - amd64
    - arm64
  main: app
  author: SpookyDoge
  developer: SpookyDoge
  category: Utilities
  icon: https://raw.githubusercontent.com/SpookyDoge/webnoveltoepub/main/web/icon.png
  thumbnail: ""
  screenshot_link: []
  title:
    en_US: webnoveltoepub
  tagline:
    en_US: Convert web novels into EPUB files
  description:
    en_US: >-
      Self-hosted web novel to EPUB converter - a server-side counterpart to the
      WebToEpub browser extension. Paste a novel URL, review the detected
      chapters and download an EPUB. Lightweight build: no headless browser.
      Supported sites: RoyalRoad, FreeWebNovel.
  index: /
  port_map: "8000"
  scheme: http
  # Careful: tips.custom MUST be a plain string. A locale map (en_US: ...)
  # breaks the import with "Tips.Custom expected type 'string'".
  tips:
    custom: >-
      Generated EPUB files are saved to /DATA/AppData/webnoveltoepub/output
      and can be browsed from the CasaOS File Manager.
