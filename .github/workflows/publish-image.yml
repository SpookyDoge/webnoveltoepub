name: Publish image

on:
  push:
    tags:
      - "v*.*.*"
  # Pozwala opublikowac pierwszy obraz (albo powtorzyc nieudany release)
  # bez tworzenia nowego taga.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 0.1.0)"
        required: true

env:
  # Wpisane wprost, a nie przez ${{ github.repository }}: GHCR odrzuca wielkie
  # litery w nazwie obrazu, a wlasciciel repo to "SpookyDoge". Ta nazwa musi sie
  # zgadzac z tym, co wskazuja pliki w deploy/.
  IMAGE: ghcr.io/spookydoge/webnoveltoepub

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        env:
          # Przez env, zeby tresc inputu nie byla wklejana do skryptu
          # przez interpolacje (script injection).
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${VERSION_INPUT#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Not a valid version: '${VERSION}'"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing version ${VERSION}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build runtime variant
        run: |
          docker build --target runtime \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${{ steps.meta.outputs.version }}" \
            .

      - name: Smoke test runtime variant
        # Zepsute :latest trafiloby prosto do instalacji CasaOS z deploy/,
        # wiec obraz musi wstac i odpowiedziec zanim cokolwiek wypchniemy.
        run: |
          set -uo pipefail
          docker run --detach --name smoke --publish 8000:8000 "${IMAGE}:latest"
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then ok=1; break; fi
            sleep 2
          done
          echo
          docker logs smoke
          docker rm --force smoke
          if [ "$ok" != "1" ]; then
            echo "::error::Runtime image did not become healthy"
            exit 1
          fi

      - name: Build playwright variant
        # Wspoldzieli warstwe `base` z wariantem runtime, wiec buduje sie
        # tylko o Chromium dluzej.
        run: |
          docker build --target playwright \
            --tag "${IMAGE}:playwright" \
            --tag "${IMAGE}:playwright-${{ steps.meta.outputs.version }}" \
            .

      - name: Push all tags
        run: |
          set -euo pipefail
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ steps.meta.outputs.version }}"
          docker push "${IMAGE}:playwright"
          docker push "${IMAGE}:playwright-${{ steps.meta.outputs.version }}"
