name: Release Windows executable

on:
  push:
    tags:
      - "v*.*.*"
  # Lets you produce a build without cutting a tag (useful for testing the
  # packaging itself). Nothing is attached to a release in that case.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 0.2.0)"
        required: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        id: meta
        shell: bash
        env:
          # Through env so the input's content is not pasted into the script
          # by interpolation (script injection).
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${VERSION_INPUT#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Not a valid version: '${VERSION}'"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset=webnoveltoepub-windows-v${VERSION}.exe" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pip install -r requirements-build.txt

      - name: Build executable
        run: pyinstaller build/pyinstaller.spec --noconfirm

      - name: Smoke test the executable
        shell: pwsh
        # A build that cannot even start would otherwise ship as a release
        # asset. Uses a port far from the default so a busy 8000 on the runner
        # cannot make this flaky.
        run: |
          $env:WNE_PORT = "8123"
          $proc = Start-Process -FilePath "dist\webnoveltoepub.exe" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8123/api/health" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          if ($ok) {
            # The frontend and the parsers travel as bundled data / hidden
            # imports; if either failed to bundle, these come back empty.
            $parsers = Invoke-WebRequest -Uri "http://127.0.0.1:8123/api/parsers" -UseBasicParsing
            $langs = Invoke-WebRequest -Uri "http://127.0.0.1:8123/api/languages" -UseBasicParsing
            $index = Invoke-WebRequest -Uri "http://127.0.0.1:8123/" -UseBasicParsing
            Write-Host "parsers: $($parsers.Content)"
            Write-Host "languages: $($langs.Content)"
            if (($parsers.Content | ConvertFrom-Json).Count -lt 1) { $ok = $false; Write-Host "::error::No parsers bundled" }
            if (($langs.Content | ConvertFrom-Json).Count -lt 1) { $ok = $false; Write-Host "::error::No locales bundled" }
            if ($index.StatusCode -ne 200) { $ok = $false; Write-Host "::error::Frontend not served" }
          } else {
            Write-Host "::error::Executable never became healthy"
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { exit 1 }

      - name: Rename asset with version
        shell: bash
        run: mv dist/webnoveltoepub.exe "dist/${{ steps.meta.outputs.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.asset }}
          path: dist/${{ steps.meta.outputs.asset }}

      - name: Attach to GitHub Release
        # Only a tag push publishes; a manual run just leaves the artifact above.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.meta.outputs.asset }}
          fail_on_unmatched_files: true
          body: |
            ### Windows

            Download `${{ steps.meta.outputs.asset }}` and run it - no Docker,
            no Python needed. The app opens in your browser and saves EPUB
            files to an `output` folder next to the executable.

            The file is not code-signed, so Windows SmartScreen will warn about
            an unknown publisher on first run: **More info** -> **Run anyway**.

            Heavy mode (JavaScript rendering) is not available in this build -
            use the Docker version for sites that need it.
