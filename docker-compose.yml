services:
  # Domyslny, lekki serwis: docker compose up
  app:
    build:
      context: .
      target: runtime
    image: webnoveltoepub:latest
    container_name: webnoveltoepub
    ports:
      - "${WNE_PORT:-8000}:8000"
    environment:
      WNE_MAX_CHAPTERS: "${WNE_MAX_CHAPTERS:-300}"
      WNE_REQUEST_DELAY: "${WNE_REQUEST_DELAY:-0.75}"
      WNE_DEFAULT_LANGUAGE: "${WNE_DEFAULT_LANGUAGE:-en}"
      WNE_LOG_LEVEL: "${WNE_LOG_LEVEL:-INFO}"
    restart: unless-stopped

  # Ciezki tryb (Chromium): docker compose --profile playwright up app-playwright
  app-playwright:
    profiles: ["playwright"]
    build:
      context: .
      target: playwright
    image: webnoveltoepub:playwright
    container_name: webnoveltoepub-playwright
    ports:
      - "${WNE_PLAYWRIGHT_PORT:-8001}:8000"
    environment:
      WNE_PLAYWRIGHT_ENABLED: "true"
      WNE_MAX_CHAPTERS: "${WNE_MAX_CHAPTERS:-300}"
      WNE_REQUEST_DELAY: "${WNE_REQUEST_DELAY:-1.5}"
      WNE_LOG_LEVEL: "${WNE_LOG_LEVEL:-INFO}"
    # Chromium potrzebuje wiecej pamieci wspoldzielonej niz domyslne 64 MB.
    shm_size: "1gb"
    restart: unless-stopped
