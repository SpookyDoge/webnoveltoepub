<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>webnoveltoepub</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📖</text></svg>">
</head>
<body>
  <header class="topbar">
    <div>
      <h1 data-i18n="app.title">webnoveltoepub</h1>
      <p class="tagline" data-i18n="app.tagline"></p>
    </div>
    <label class="lang-switch">
      <span data-i18n="language.label"></span>
      <select id="language-select"></select>
    </label>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" id="tab-convert" class="tab active" role="tab"
            aria-selected="true" data-i18n="tabs.convert"></button>
    <button type="button" id="tab-library" class="tab" role="tab"
            aria-selected="false" data-i18n="tabs.library"></button>
    <button type="button" id="tab-settings" class="tab" role="tab"
            aria-selected="false" data-i18n="tabs.settings"></button>
  </nav>

  <main>
    <section id="panel-convert">
    <section class="card">
      <form id="preview-form">
        <label for="url-input" data-i18n="form.url.label"></label>
        <input id="url-input" name="url" type="url" required
               data-i18n-placeholder="form.url.placeholder" autocomplete="off">
        <p class="hint" data-i18n="form.url.hint"></p>
        <button type="submit" id="preview-button" data-i18n="form.preview"></button>
      </form>
      <details class="supported">
        <summary data-i18n="supported.title"></summary>
        <ul id="parser-list"></ul>
      </details>
    </section>

    <section id="error-box" class="card error" hidden>
      <strong data-i18n="error.title"></strong>
      <p id="error-message"></p>
    </section>

    <!-- One progress panel for every long operation: conversion, a single
         library update and a whole-library run. It sits outside the chapter
         card on purpose - a library update has no chapter list to show, so
         anything nested in that card would be invisible. -->
    <section id="job-card" class="card job-card" hidden>
      <p id="job-kind" class="job-kind"></p>
      <h2 id="job-title" class="job-title"></h2>
      <p id="job-series" class="meta" hidden></p>

      <div id="job-progress" class="progress" hidden>
        <progress id="job-bar" value="0" max="100"></progress>
        <span id="job-counter" class="badge subtle"></span>
        <button type="button" id="job-pause" data-i18n="job.pause"></button>
        <button type="button" id="job-stop" data-i18n="job.stop"></button>
      </div>

      <p id="job-stop-note" class="hint" hidden></p>
      <p id="status-message" class="status" hidden></p>
      <a id="job-download" class="button-link" hidden download></a>
    </section>

    <section id="novel-card" class="card novel" hidden>
      <img id="novel-cover" alt="" hidden>
      <div class="novel-info">
        <h2 id="novel-title"></h2>
        <p><span class="label" data-i18n="novel.author"></span>: <span id="novel-author"></span></p>
        <p id="novel-description" class="description"></p>
        <p class="meta">
          <span class="label" data-i18n="novel.source"></span>:
          <a id="novel-source" href="#" target="_blank" rel="noopener noreferrer"></a>
        </p>
        <p id="novel-tags" class="tags"></p>
      </div>
    </section>

    <section id="chapters-card" class="card" hidden>
      <div class="chapters-header">
        <h2 data-i18n="chapters.title"></h2>
        <span id="chapters-count" class="badge"></span>
      </div>

      <p id="limit-warning" class="warning" hidden></p>

      <div class="chapter-controls">
        <button type="button" id="select-all" data-i18n="chapters.select_all"></button>
        <button type="button" id="select-none" data-i18n="chapters.select_none"></button>
        <span class="range-controls">
          <label for="range-start" data-i18n="chapters.range_from"></label>
          <input id="range-start" type="number" min="1" step="1" value="1">
          <label for="range-end" data-i18n="chapters.range_to"></label>
          <input id="range-end" type="number" min="1" step="1">
          <button type="button" id="apply-range" data-i18n="chapters.range_apply"></button>
        </span>
        <span id="selected-count" class="badge subtle"></span>
      </div>

      <ol id="chapter-list" class="chapter-list"></ol>

      <fieldset class="options">
        <legend data-i18n="options.title"></legend>
        <label class="checkbox">
          <input type="checkbox" id="include-cover" checked>
          <span data-i18n="options.include_cover"></span>
        </label>
        <label>
          <span data-i18n="options.language"></span>
          <input id="book-language" type="text" size="6" placeholder="en">
        </label>
      </fieldset>

      <button type="button" id="convert-button" class="primary" data-i18n="convert.button"></button>
    </section>
    </section>

    <section id="panel-library" hidden>
      <section class="card">
        <div class="chapters-header">
          <h2 data-i18n="library.title"></h2>
          <span id="library-count" class="badge"></span>
        </div>
        <p class="hint" data-i18n="library.hint"></p>
        <div class="chapter-controls">
          <button type="button" id="update-all" class="primary" data-i18n="library.update_all"></button>
          <button type="button" id="library-refresh" data-i18n="library.refresh"></button>
          <button type="button" id="import-button" data-i18n="library.import"></button>
          <input type="file" id="import-file" accept=".zip,.json" hidden>
        </div>
        <p class="hint" data-i18n="library.import_hint"></p>
        <!-- No progress bar here on purpose: updates report into the shared
             job panel on the Convert tab, which is where every long operation
             is shown. -->
        <p id="library-status" class="status" hidden></p>
        <p id="library-empty" class="hint" data-i18n="library.empty" hidden></p>
        <ul id="library-list" class="library-list"></ul>
      </section>
    </section>

    <section id="panel-settings" hidden>
      <section class="card">
        <h2 data-i18n="settings.title"></h2>

        <label class="checkbox">
          <input type="checkbox" id="auto-update-enabled">
          <span data-i18n="settings.auto_update"></span>
        </label>
        <p class="hint" data-i18n="settings.auto_update_hint"></p>

        <div id="interval-row" hidden>
          <label for="auto-update-interval" data-i18n="settings.interval"></label>
          <input id="auto-update-interval" type="number" min="1" step="1" value="24">
        </div>

        <label class="checkbox">
          <input type="checkbox" id="check-on-startup">
          <span data-i18n="settings.check_on_startup"></span>
        </label>

        <p id="settings-schedule" class="meta"></p>
        <p id="exe-note" class="warning" data-i18n="settings.exe_note" hidden></p>

        <button type="button" id="save-settings" class="primary" data-i18n="settings.save"></button>
        <p id="settings-status" class="status" hidden></p>
      </section>

      <section class="card">
        <h2 data-i18n="settings.history"></h2>
        <p class="hint" data-i18n="settings.history_hint"></p>
        <p id="history-empty" class="hint" data-i18n="settings.history_empty" hidden></p>
        <ul id="run-log" class="library-list"></ul>
      </section>
    </section>
  </main>

  <footer>
    <a href="https://github.com/SpookyDoge/webnoveltoepub" target="_blank"
       rel="noopener noreferrer" data-i18n="footer.source"></a>
    <span data-i18n="footer.notice"></span>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
